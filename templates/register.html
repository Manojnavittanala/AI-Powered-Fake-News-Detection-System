<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | Fraud News Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="header">
        <nav class="container">
            <div class="brand">Fraud News Detector</div>
            <div class="menu">
                <a href="{{ url_for('index') }}">Home</a>
                <a href="{{ url_for('login') }}">Login</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <section class="form-card card" style="max-width: 540px; margin: 2rem auto;">
            <h2>Create account</h2>
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert {{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            <form method="POST" action="{{ url_for('register') }}">
                <input type="text" name="name" placeholder="Full name" required>
                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Password" required>
                <input type="password" name="confirm_password" placeholder="Confirm password" required>
                <button type="submit" class="primary">Register</button>
            </form>
            <p style="margin-top: 1rem; color: var(--muted);">Already have an account? <a href="{{ url_for('login') }}">Login here.</a></p>
        </section>
    </main>
</body>
</html>
